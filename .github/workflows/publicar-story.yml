name: Publicar story

on:
  schedule:
    # Horario em UTC: 12:07 UTC = 9:07 em Brasilia.
    # Evite o minuto 00: o GitHub atrasa mais as execucoes no inicio de cada hora.
    - cron: "7 12 * * *"
  workflow_dispatch:
    inputs:
      comando:
        description: "O que fazer"
        type: choice
        default: verificar
        options:
          - verificar
          - simulacao
          - publicar
      forcar:
        description: "Publicar mesmo se ja saiu um story hoje"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-story

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Executar
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          COMANDO: ${{ inputs.comando || 'publicar' }}
          FORCAR: ${{ inputs.forcar || false }}
        run: |
          argumentos=("$COMANDO")
          if [ "$FORCAR" = "true" ]; then argumentos+=(--forcar); fi
          python3 publicar_story.py "${argumentos[@]}"

      - name: Salvar a fila atualizada
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fila publicados
          git commit -m "Story publicado em $(TZ=America/Sao_Paulo date +%F)"
          git pull --rebase
          git push
